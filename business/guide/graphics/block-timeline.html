<!DOCTYPE html><html><head><meta charset="utf-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1500px; height:940px; background:#141A13; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; overflow:hidden; }
.wrap { padding:56px 64px; height:100%; display:flex; flex-direction:column; }
h1 { color:#F4F0E6; font-size:40px; font-weight:800; }
p.sub { color:#9AA694; font-size:20px; margin-top:8px; }
svg { flex:1; margin-top:10px; }
.tick { fill:#9AA694; font-size:18px; }
.wk { fill:#D8D4C8; font-size:17px; }
.ann { fill:#F4F0E6; font-size:18px; font-weight:700; }
.ann2 { fill:#9AA694; font-size:16.5px; }
.zone { fill:#7FA96E; font-size:15px; letter-spacing:0.14em; font-weight:700; }
.takeaway { margin:26px 0 6px; background:#1C241B; border:1px solid #7FA96E; border-radius:14px; padding:20px 28px; color:#F4F0E6; font-size:23px; font-weight:600; text-align:center; }
</style></head><body><div class="wrap">
<h1>Anatomy of a Training Block</h1>
<p class="sub">3–6 overload weeks, one deload, restart slightly higher — "do the optimal thing year-round and it stops being optimal"</p>
<svg viewBox="0 0 1372 560" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
<!-- x scale: week1..8 -> 120..1300 (168/wk) -->
<!-- BLOCK 1: weeks1-4 climbing 300->180, week5 deload dip to 330 ; BLOCK 2: weeks6-8 climbing 240->140 -->
<!-- block1 overload -->
<polyline points="120,300 288,265 456,230 624,195" fill="none" stroke="#7FA96E" stroke-width="6"/>
<!-- deload dip -->
<polyline points="624,195 792,330" fill="none" stroke="#9AA694" stroke-width="6" stroke-dasharray="12 9"/>
<!-- block2 climbs from the dip, crossing above block-1 start level within W6 -->
<polyline points="792,330 960,255 1128,195 1296,145" fill="none" stroke="#7FA96E" stroke-width="6"/>
<circle cx="120" cy="300" r="9" fill="#7FA96E" stroke="#141A13" stroke-width="3"/>
<circle cx="624" cy="195" r="9" fill="#7FA96E" stroke="#141A13" stroke-width="3"/>
<circle cx="792" cy="330" r="9" fill="#9AA694" stroke="#141A13" stroke-width="3"/>
<circle cx="1296" cy="145" r="9" fill="#7FA96E" stroke="#141A13" stroke-width="3"/>
<!-- annotations -->
<text x="372" y="150" text-anchor="middle" class="ann">BLOCK 1 — OVERLOAD</text>
<text x="372" y="176" text-anchor="middle" class="ann2">add reps weekly &#183; add sets &#183; ramp effort (RPE 6&#8594;9)</text>
<text x="708" y="420" text-anchor="middle" class="ann">DELOAD</text>
<text x="708" y="446" text-anchor="middle" class="ann2">fatigue leaves, fitness stays</text>
<text x="1044" y="90" text-anchor="middle" class="ann">BLOCK 2 — SAME ENGINE, NEW BASE</text>
<text x="1044" y="116" text-anchor="middle" class="ann2">starts higher than Block 1 did — that gap IS your progress</text>
<line x1="120" y1="300" x2="1296" y2="300" stroke="#9AA694" stroke-width="2" stroke-dasharray="6 6"/>
<text x="130" y="322" text-anchor="start" class="ann2">block 1 starting level</text>
<line x1="960" y1="255" x2="960" y2="300" stroke="#7FA96E" stroke-width="3"/>
<text x="985" y="352" text-anchor="start" class="ann2" fill="#7FA96E" style="fill:#7FA96E;">above it from here on</text>
<!-- week ticks -->
<line x1="120" y1="500" x2="120" y2="512" stroke="#9AA694" stroke-width="2"/><text x="120" y="540" text-anchor="middle" class="tick">W1</text>
<line x1="288" y1="500" x2="288" y2="512" stroke="#9AA694" stroke-width="2"/><text x="288" y="540" text-anchor="middle" class="tick">W2</text>
<line x1="456" y1="500" x2="456" y2="512" stroke="#9AA694" stroke-width="2"/><text x="456" y="540" text-anchor="middle" class="tick">W3</text>
<line x1="624" y1="500" x2="624" y2="512" stroke="#9AA694" stroke-width="2"/><text x="624" y="540" text-anchor="middle" class="tick">W4</text>
<line x1="792" y1="500" x2="792" y2="512" stroke="#9AA694" stroke-width="2"/><text x="792" y="540" text-anchor="middle" class="tick">W5</text>
<line x1="960" y1="500" x2="960" y2="512" stroke="#9AA694" stroke-width="2"/><text x="960" y="540" text-anchor="middle" class="tick">W6</text>
<line x1="1128" y1="500" x2="1128" y2="512" stroke="#9AA694" stroke-width="2"/><text x="1128" y="540" text-anchor="middle" class="tick">W7</text>
<line x1="1296" y1="500" x2="1296" y2="512" stroke="#9AA694" stroke-width="2"/><text x="1296" y="540" text-anchor="middle" class="tick">W8</text>
<line x1="120" y1="500" x2="1296" y2="500" stroke="#9AA694" stroke-width="2"/>
<text x="1296" y="540" text-anchor="end" class="ann2" dx="-40" dy="-24" ></text>
</svg>
<div class="takeaway">Between blocks, something changes — 1–2 more weekly reps, +5% load, or a swap when a movement stalls.</div>
</div></body></html>
