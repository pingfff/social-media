<!DOCTYPE html><html><head><meta charset="utf-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1500px; height:940px; background:#141A13; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; overflow:hidden; }
.wrap { padding:56px 64px; height:100%; display:flex; flex-direction:column; }
h1 { color:#F4F0E6; font-size:40px; font-weight:800; }
p.sub { color:#9AA694; font-size:20px; margin-top:8px; }
svg { flex:1; margin-top:6px; }
.def { fill:#D8D4C8; font-size:26px; font-weight:800; }
.who { fill:#9AA694; font-size:16.5px; }
.mnt { fill:#F4F0E6; font-size:20px; font-weight:700; }
.zone { fill:#7FA96E; font-size:15px; letter-spacing:0.14em; font-weight:700; }
.takeaway { margin:26px 0 6px; background:#1C241B; border:1px solid #7FA96E; border-radius:14px; padding:20px 28px; color:#F4F0E6; font-size:22.5px; font-weight:600; text-align:center; }
</style></head><body><div class="wrap">
<h1>Step 2: Apply Your Goal to the Number</h1>
<p class="sub">Deficit tiers on the left, the muscle-gain window on the right — maintenance in the middle</p>
<svg viewBox="0 0 1372 560" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
<line x1="80" y1="300" x2="1292" y2="300" stroke="#9AA694" stroke-width="3"/>
<!-- maintenance center at 686 -->
<circle cx="686" cy="300" r="12" fill="#7FA96E"/>
<text x="686" y="348" text-anchor="middle" class="mnt">maintenance</text>
<!-- deficit markers left: -500 x=420, -750 x=300, -1000 x=180 -->
<circle cx="420" cy="300" r="9" fill="#D8D4C8"/>
<text x="420" y="256" text-anchor="middle" class="def">&#8722;500</text>
<text x="420" y="382" text-anchor="middle" class="who">the sweet spot for most &mdash; ~1 lb fat/week</text>
<circle cx="290" cy="300" r="9" fill="#D8D4C8"/>
<text x="290" y="196" text-anchor="middle" class="def">&#8722;750</text>
<text x="290" y="382" text-anchor="middle" class="who">can handle the hunger, want it faster</text>
<circle cx="160" cy="300" r="9" fill="#D8D4C8"/>
<text x="160" y="136" text-anchor="middle" class="def">&#8722;1000</text>
<text x="160" y="382" text-anchor="middle" class="who">experienced dieters, short bursts only &mdash;</text>
<text x="160" y="406" text-anchor="middle" class="who">costs performance as you get leaner</text>
<text x="300" y="470" text-anchor="middle" class="zone">FAT LOSS &mdash; PICK YOUR TIER</text>
<!-- surplus window right: +100 x=900, +200 x=1120 -->
<line x1="920" y1="300" x2="1130" y2="300" stroke="#7FA96E" stroke-width="10" stroke-linecap="round"/>
<circle cx="920" cy="300" r="9" fill="#7FA96E"/>
<circle cx="1130" cy="300" r="9" fill="#7FA96E"/>
<text x="1025" y="246" text-anchor="middle" class="def">+100 to +200</text>
<text x="1025" y="382" text-anchor="middle" class="who">beginners toward the top end; advanced staying</text>
<text x="1025" y="406" text-anchor="middle" class="who">lean toward the bottom &mdash; that's the whole window</text>
<text x="1025" y="470" text-anchor="middle" class="zone">MUSCLE GAIN &mdash; THAT&rsquo;S IT</text>
<text x="1240" y="286" text-anchor="end" class="who" dx="0" dy="-40" ></text>
</svg>
<div class="takeaway">No prize for bulking harder: growth is capped by what you can synthesize — past it, every calorie is fat. Aggressive bulks just buy a hungrier cut.</div>
</div></body></html>
