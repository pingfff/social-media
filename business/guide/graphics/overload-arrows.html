<!DOCTYPE html><html><head><meta charset="utf-8"><style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1500px; height:940px; background:#141A13; font-family:'Helvetica Neue',Helvetica,Arial,sans-serif; overflow:hidden; }
.wrap { padding:56px 64px; height:100%; display:flex; flex-direction:column; }
h1 { color:#F4F0E6; font-size:40px; font-weight:800; }
p.sub { color:#9AA694; font-size:20px; margin-top:8px; }
svg { flex:1; margin-top:10px; }
.hub { fill:#7FA96E; }
.hubt { fill:#141A13; font-size:26px; font-weight:800; letter-spacing:0.02em; }
.arrow { stroke:#7FA96E; stroke-width:5; fill:none; }
.arrowhead { fill:#7FA96E; }
.lab { fill:#F4F0E6; font-size:23px; font-weight:700; }
.sub2 { fill:#9AA694; font-size:17.5px; }
.foot { fill:#9AA694; font-size:18px; }
</style></head><body><div class="wrap">
<h1>Progressive Overload: Five Routes Up</h1>
<p class="sub">"Add 5lbs to the bar" is only one of them — all five count, only one shows up on the bar</p>
<svg viewBox="0 0 1372 700" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
<defs><marker id="ah" markerWidth="12" markerHeight="12" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#7FA96E"/></marker></defs>
<!-- hub -->
<circle cx="686" cy="350" r="140" class="hub"/>
<text x="686" y="342" text-anchor="middle" class="hubt">PROGRESSIVE</text>
<text x="686" y="374" text-anchor="middle" class="hubt">OVERLOAD</text>
<!-- arrows -->
<line x1="580" y1="255" x2="380" y2="150" class="arrow" marker-end="url(#ah)"/>
<line x1="570" y1="350" x2="420" y2="350" class="arrow" marker-end="url(#ah)"/>
<line x1="580" y1="445" x2="380" y2="550" class="arrow" marker-end="url(#ah)"/>
<line x1="792" y1="255" x2="992" y2="150" class="arrow" marker-end="url(#ah)"/>
<line x1="802" y1="445" x2="1002" y2="550" class="arrow" marker-end="url(#ah)"/>
<!-- labels -->
<text x="300" y="92" text-anchor="start" class="lab">More reps</text>
<text x="300" y="118" text-anchor="start" class="sub2">same weight, +1 rep at a time</text>
<text x="300" y="292" text-anchor="start" class="lab">More sets</text>
<text x="300" y="318" text-anchor="start" class="sub2">chest 14 &#8594; 15 &#8594; 16 weekly</text>
<text x="300" y="620" text-anchor="start" class="lab">Better technique</text>
<text x="300" y="646" text-anchor="start" class="sub2">fuller range, deeper stretch, tighter control</text>
<text x="1072" y="92" text-anchor="end" class="lab">Better connection</text>
<text x="1072" y="118" text-anchor="end" class="sub2">mind-muscle link — real for isolations</text>
<text x="1072" y="620" text-anchor="end" class="lab">Better exercise swap</text>
<text x="1072" y="646" text-anchor="end" class="sub2">a lift that fits your mechanics better</text>
</svg>
</div></body></html>
